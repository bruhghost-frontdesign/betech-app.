<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BETHEC - OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f3f4f6}
.top-bar{display:flex;gap:8px;padding:10px;background:#fff;border-bottom:2px solid #000;position:sticky;top:0;z-index:20}
.top-bar button{border:1.5px solid #000;border-radius:20px;padding:10px 16px;font-weight:800;cursor:pointer;background:#fff}
.top-bar button.active{background:#000;color:#fff}
.view{display:none}
.view.active{display:block}
.container{max-width:900px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:16px;border:1.5px solid #000;box-shadow:4px 4px 0 #000;padding:16px;margin-bottom:12px}
.company-select{width:100%;padding:12px;border-radius:12px;border:1.5px solid #000;font-weight:700;margin-bottom:8px}
.os-number{text-align:center;border:1.5px solid #000;border-radius:12px;padding:14px;margin:14px 0;box-shadow:3px 3px 0 #000}
.form-grid{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid #000}
.form-grid .field{border:0.5px solid #000;padding:10px}
.field label{font-weight:800;font-size:13px}
.field input{border:none;border-bottom:1px solid #999;width:100%;padding:6px 0;outline:none}
#sigCanvas{width:100%;height:180px;border:2px solid #000;border-radius:12px;touch-action:none;background:#fff}
.status-option{display:flex;align-items:center;gap:10px;border:2px solid #000;border-radius:30px;padding:12px 16px;font-weight:800;margin-top:8px;cursor:pointer;background:#fff}
.status-option input{width:20px;height:20px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fotos button{padding:12px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
.btn-cam{background:#2563eb;color:#fff}.btn-gal{background:#374151;color:#fff}
.thumb-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb-grid img{width:70px;height:70px;object-fit:cover;border:1.5px solid #000;border-radius:8px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.action-row button{padding:16px;border-radius:14px;font-weight:900;cursor:pointer;border:2px solid #000}
.btn-pdf{background:#000;color:#fff}
.empresa-item{border:1.5px solid #000;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#fff}
.empresa-item:hover{background:#eef2ff}
@media(min-width:768px){.form-grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1024px){.form-grid{grid-template-columns:1fr 1fr 1fr 1fr}.container{max-width:1100px}}
</style>
</head>
<body>

<div class="top-bar">
  <button id="btn-home" onclick="mudarTela('home')">🏠 Home</button>
  <button id="btn-os" class="active" onclick="mudarTela('os')">🧾 OS</button>
  <button id="btn-empresas" onclick="mudarTela('empresas')">📁 Empresas</button>
</div>

<!-- HOME -->
<div id="view-home" class="view">
  <div class="container">
    <div class="card"><h2>Home BETHEC</h2><p style="margin-top:8px">Selecione o que deseja fazer:</p>
      <button class="company-select" style="margin-top:12px;background:#000;color:#fff" onclick="mudarTela('os')">+ Nova OS</button>
      <button class="company-select" onclick="mudarTela('empresas')">Ver Empresas Cadastradas</button>
    </div>
  </div>
</div>

<!-- OS -->
<div id="view-os" class="view active">
  <div class="container">
    <div class="card">
      <label><b>Empresa (pasta) *</b> - Clique para selecionar</label>
      <select id="empresaSelect" class="company-select" style="background:#fef9c3" onchange="selecionarEmpresa(this.value)">
        <option value="">Selecione a empresa *</option>
      </select>
      <input id="empresaInput" class="company-select" placeholder="Ou digite nova empresa e pressione Enter" onkeydown="if(event.key==='Enter')addEmpresa()">
      <small>Pasta atual: <b id="pastaNome" style="color:#2563eb">Nenhuma</b> - Salvamento automático ativo</small>
    </div>

    <div class="card">
      <div class="os-number"><b>ORDEM DE SERVIÇO Nº <span id="numOS">8537</span></b><div id="dataOS" style="margin-top:6px"></div></div>
      <div class="form-grid">
        <div class="field"><label>Empresa</label><input id="fEmpresa"></div>
        <div class="field"><label>Cidade</label><input id="fCidade"></div>
        <div class="field"><label>Marca</label><input id="fMarca"></div>
        <div class="field"><label>Modelo</label><input id="fModelo"></div>
        <div class="field"><label>Chassis</label><input id="fChassis"></div>
        <div class="field"><label>Frota</label><input id="fFrota"></div>
      </div>
      <div style="margin:12px 0;border:1.5px dashed #000;border-radius:12px;padding:12px;display:flex;gap:12px;flex-wrap:wrap">
        <strong>Tipo:</strong>
        <label><input type="radio" name="tipo" value="Corretiva"> Corretiva</label>
        <label><input type="radio" name="tipo" value="Preventiva"> Preventiva</label>
        <label><input type="checkbox" id="tipoOrc"> Orçamento</label>
      </div>
      <div><b>ASSINATURA</b><canvas id="sigCanvas"></canvas><br><button onclick="limparAss()">Limpar</button></div>
      <div style="margin-top:12px"><b>STATUS</b>
        <label class="status-option"><input type="radio" name="status" value="LIBERADO" checked> LIBERADO</label>
        <label class="status-option"><input type="radio" name="status" value="PARADO"> PARADO</label>
        <label class="status-option"><input type="radio" name="status" value="AGUARDANDO PEÇA"> AGUARDANDO PEÇA</label>
      </div>
      <div class="field" style="margin-top:10px;border:1.5px solid #000;border-radius:10px"><label>Técnico</label><input id="fTecnico"></div>
      <div class="action-row"><button onclick="window.print()">Imprimir</button><button class="btn-pdf" onclick="gerarPDF()">Gerar PDF</button></div>
    </div>
  </div>
</div>

<!-- EMPRESAS -->
<div id="view-empresas" class="view">
  <div class="container">
    <div class="card">
      <h2>Empresas Cadastradas</h2>
      <div id="listaEmpresas" style="margin-top:12px"></div>
      <p id="semEmpresa" style="color:#666;display:none">Nenhuma empresa cadastrada ainda.</p>
    </div>
  </div>
</div>

<script>
let dados={antes:[],depois:[],assinatura:null}
function mudarTela(tela){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.top-bar button').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tela).classList.add('active');
  document.getElementById('btn-'+tela).classList.add('active');
  if(tela==='empresas') renderListaEmpresas();
}

function selecionarEmpresa(valor){
  if(!valor) return;
  localStorage.setItem('bethec_empresa_atual', valor);
  document.getElementById('pastaNome').innerText=valor;
  document.getElementById('fEmpresa').value=valor;
  salvarAuto();
  alert('Empresa selecionada: '+valor+'\nAgora a OS será salva na pasta dessa empresa.');
}

function addEmpresa(){
  let v=document.getElementById('empresaInput').value.trim(); if(!v)return;
  let emps=JSON.parse(localStorage.getItem('bethec_empresas')||'[]'); 
  if(!emps.includes(v)) emps.push(v);
  localStorage.setItem('bethec_empresas',JSON.stringify(emps)); 
  document.getElementById('empresaInput').value=''; 
  carregarEmpresas(); 
  document.getElementById('empresaSelect').value=v; 
  selecionarEmpresa(v);
}

function carregarEmpresas(){
  let emps=JSON.parse(localStorage.getItem('bethec_empresas')||'[]'); 
  let sel=document.getElementById('empresaSelect');
  let atual = localStorage.getItem('bethec_empresa_atual') || '';
  sel.innerHTML='<option value="">Selecione a empresa *</option>'; 
  emps.forEach(e=>{
    let o=document.createElement('option'); o.value=e; o.innerText=e;
    if(e===atual) o.selected=true;
    sel.appendChild(o)
  });
  if(atual) document.getElementById('pastaNome').innerText=atual;
}

function renderListaEmpresas(){
  let emps=JSON.parse(localStorage.getItem('bethec_empresas')||'[]');
  let lista=document.getElementById('listaEmpresas');
  let vazio=document.getElementById('semEmpresa');
  if(emps.length===0){ lista.innerHTML=''; vazio.style.display='block'; return; }
  vazio.style.display='none';
  lista.innerHTML='';
  emps.forEach(emp=>{
    let count=Object.keys(localStorage).filter(k=>k.startsWith('bethec_os_'+emp+'_')).length;
    let div=document.createElement('div');
    div.className='empresa-item';
    div.innerHTML=`<div><b>${emp}</b><br><small>${count} OS salvas</small></div><div>📁 Abrir</div>`;
    div.onclick=()=>{
      document.getElementById('empresaSelect').value=emp;
      selecionarEmpresa(emp);
      mudarTela('os');
    };
    lista.appendChild(div);
  });
}

function setupCanvas(){
  const c=document.getElementById('sigCanvas'); const ctx=c.getContext('2d');
  function resize(){ const r=c.getBoundingClientRect(); c.width=r.width*2; c.height=r.height*2; ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'}; resize();
  let drawing=false; 
  function pos(e){ const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left,y:t.clientY-rect.top} }
  c.addEventListener('mousedown',e=>{drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y)}); 
  c.addEventListener('mousemove',e=>{ if(!drawing)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke()});
  c.addEventListener('mouseup',()=>{drawing=false; dados.assinatura=c.toDataURL();});
  c.addEventListener('touchstart',e=>{drawing=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault()}, {passive:false});
  c.addEventListener('touchmove',e=>{ if(!drawing)return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault()}, {passive:false});
  c.addEventListener('touchend',()=>{drawing=false; dados.assinatura=c.toDataURL();});
}
function limparAss(){ const c=document.getElementById('sigCanvas'); c.getContext('2d').clearRect(0,0,c.width,c.height); dados.assinatura=null; }
function salvarAuto(){
  let empresa=document.getElementById('empresaSelect').value || document.getElementById('fEmpresa').value;
  let payload={empresa, fEmpresa:document.getElementById('fEmpresa').value, num:document.getElementById('numOS').innerText, dados};
  if(empresa) localStorage.setItem('bethec_os_'+empresa+'_'+payload.num, JSON.stringify(payload));
  localStorage.setItem('bethec_current_os', JSON.stringify(payload));
}
function gerarPDF(){
  const {jsPDF}=window.jspdf; const doc=new jsPDF(); 
  let empresa=document.getElementById('empresaSelect').value||'SemEmpresa';
  doc.text('BETHEC OS '+document.getElementById('numOS').innerText+' - '+empresa,10,15);
  doc.save('OS_'+empresa+'.pdf');
  setTimeout(()=>{
    if(confirm('PDF salvo na pasta '+empresa+'\nEnviar para bethecemp@outlook.com?')){
      window.location.href='mailto:bethecemp@outlook.com?subject=OS '+document.getElementById('numOS').innerText;
    }
  },500);
}
function init(){
  document.getElementById('dataOS').innerText=new Date().toLocaleDateString('pt-BR');
  let num=localStorage.getItem('bethec_last_os'); if(!num) num=8537; else num=parseInt(num)+1;
  document.getElementById('numOS').innerText=num; localStorage.setItem('bethec_last_os',num);
  carregarEmpresas(); setupCanvas();
}
init();
</script>
</body>
</html>
